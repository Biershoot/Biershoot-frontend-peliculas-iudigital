# configuración para desplegar el frontend en Render como sitio estático
services:
  - type: web
    name: frontend-peliculas-iudigital
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    # como se usa BrowserRouter, todas las rutas deben devolver el index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
